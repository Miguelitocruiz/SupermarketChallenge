products first.'}requestAnimationFrame(draw)}function interact(){const n=nearest();if(n.d>76){cartMessage('Walk closer to a shelf or the checkout counter.');return}if(n.type==='product')addProduct(products[n.spot.index].name);else if(count()<3)cartMessage('Pick at least 3 products before checkout.');else{sfx('checkout');quiz(4)}}function keydown(e){const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();if(k==='arrowup'||k==='w')held.add('up');if(k==='arrowdown'||k==='s')held.add('down');if(k==='arrowleft'||k==='a')held.add('left');if(k==='arrowright'||k==='d')held.add('right');if((k==='e'||k===' ')&&!e.repeat)interact()}function keyup(e){const k=e.key.toLowerCase();if(k==='arrowup'||k==='w')held.delete('up');if(k==='arrowdown'||k==='s')held.delete('down');if(k==='arrowleft'||k==='a')held.delete('left');if(k==='arrowright'||k==='d')held.delete('right')}function tick(){if(!storeAlive)return;const dx=(held.has('right')?1:0)-(held.has('left')?1:0),dy=(held.has('down')?1:0)-(held.has('up')?1:0),len=Math.hypot(dx,dy)||1;player.x=Math.max(24,Math.min(1024,player.x+dx/len*3));player.y=Math.max(82,Math.min(372,player.y+dy/len*3));requestAnimationFrame(tick)}function canvasTap(e){const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*1050/r.width,y=(e.clientY-r.top)*390/r.height,targets=[...spots.map(s=>({x:s.x,y:s.y,run:()=>{player.x=s.x;player.y=s.y;interact()}})),{x:register.x,y:register.y,run:()=>{player.x=register.x;player.y=register.y;interact()}}].sort((a,b)=>Math.hypot(a.x-x,a.y-y)-Math.hypot(b.x-x,b.y-y));if(Math.hypot(targets[0].x-x,targets[0].y-y)<95)targets[0].run()}function blur(){held.clear()}window.addEventListener('keydown',keydown);window.addEventListener('keyup',keyup);window.addEventListener('blur',blur);canvas.addEventListener('pointerdown',canvasTap);document.querySelector('#interact').onclick=interact;document.querySelectorAll('[data-dir]').forEach(b=>{const dir=b.dataset.dir,on=e=>{e.preventDefault();held.add(dir)},off=e=>{e.preventDefault();held.delete(dir)};b.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,off))});storeCleanup=()=>{window.removeEventListener('keydown',keydown);window.removeEventListener('keyup',keyup);window.removeEventListener('blur',blur);canvas.removeEventListener('pointerdown',canvasTap)};draw();tick()}
function victory(){stopStore();if(!won){score+=20;won=true;sfx('win')}level=5;updateHud();app.innerHTML=`<section class="panel victory"><div class="trophy">🏆</div><span class="kicker">THE SHOP IS COMPLETE!</span><h2>Congratulations,<br>Decimal Master!</h2><p class="final-score">Final score: ${score} points</p><p style="font-weight:900;font-size:1.1rem">You completed your shopping without exceeding your budget!</p><div class="receipt" style="margin:20px auto"><h3>FRESH & FUN MARKET</h3><p>YOUR SHOPPING RECEIPT</p>${cart.map(p=>`<div class="receipt-line"><span>${p.qty} × ${p.name}</span><span>${money(p.cents*p.qty)}</span></div>`).join('')}<div class="receipt-line receipt-sum"><span>TOTAL SPENT</span><span>${money(total())}</span></div><div class="receipt-line"><span>MONEY LEFT</span><span>${money(2000-total())}</span></div></div><div class="skills"><span>🔎 Compare decimals</span><span>🔢 Round numbers</span><span>➕ Add money</span><span>➖ Find change</span><span>🛒 Budget wisely</span></div><p class="note">You practiced reading and ordering decimal prices, rounding, addition, subtraction and budgeting.</p><button id="again" class="primary start-button">↻ PLAY AGAIN</button></section>`;document.querySelector('#again').onclick=()=>{score=0;cart=[];won=false;home()}}
home();
})();
